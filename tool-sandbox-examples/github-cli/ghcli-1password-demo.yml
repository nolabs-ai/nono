speed: 80
delay: 50
clear: true
show_exit_status: false

setup:
  - export ONEPASSWORD_PROFILE=./ghcli-profile-1password.json
  - export BASIC_PROFILE=./basic.json
  - export GH_OP_URI="$(jq -r '.command_policies.credentials["github-1password"].credential_key' "$ONEPASSWORD_PROFILE")"

steps:
  - pause
  - comment: "This demo uses a local profile file from the current directory."
    style: blue
  - text: >-
      ls -l "$ONEPASSWORD_PROFILE"

  - pause
  - comment: "A tool sandbox configured just for gh: the github-1password route is bound by name to this command, alongside its pinned binary, filesystem reads, L7 endpoint policy, and argv policy."
    style: blue
  - text: >-
      jq '. as $profile | .command_policies.commands.gh | { executable, credential_binding: (.from.session.sandbox.credentials[0] as $binding | $profile.command_policies.credentials[$binding.name] as $route | { sandbox_credential_name: $binding.name, credential_source: $route.credential_key, phantom_env: $route.env_var, upstream: $route.upstream, injected_header: $route.inject_header, credential_format: $route.credential_format }), sandbox_reads: .from.session.sandbox.fs_read, sandbox_config_files: .from.session.sandbox.fs_read_file, l7_endpoint_policy: (.from.session.sandbox.credentials[0].endpoint_policy | {default, allow: [.allow[] | "\(.method) \(.path)"], deny: [.deny[] | "\(.method) \(.path)"]}), argv_policy: (.from.session.invocation_policy | {default, allow: [.allow[].argv | (.prefix // .exact) | join(" ")], deny: [.deny[].argv | (.prefix // .exact) | join(" ")]}) }' "$ONEPASSWORD_PROFILE"
    speed: 500
    jitter: 0
    pause: 0

  - pause
  - comment: "The profile extends the Claude Code base while applying the same mediated gh allow and deny policy to child tool calls."
    style: blue
  - text: >-
      jq '{extends, gh_allow: [.command_policies.commands.gh.from.session.invocation_policy.allow[].argv | (.prefix // .exact) | join(" ")], gh_deny: [.command_policies.commands.gh.from.session.invocation_policy.deny[].argv | (.prefix // .exact) | join(" ")]}' "$ONEPASSWORD_PROFILE"

  - pause
  - comment: "Direct 1Password read: resolve the profile's exact op:// credential source while discarding the real token."
    style: blue
  - text: >-
      op read "$GH_OP_URI" >/dev/null && printf 'direct op read resolved: %s\n' "$GH_OP_URI"

  - pause
  - comment: "Brokered read: nono's diagnostics show the same op:// source loaded into the github-1password route; gh then prints only its phantom token."
    style: blue
  - text: >-
      nono run -vv --allow-cwd --profile "$ONEPASSWORD_PROFILE" -- gh auth token 2>&1 | grep -E 'Loading secret from 1Password|/github-1password|^[0-9a-f]{64}$'

  - pause
  - comment: "Authenticated API read: the proxy replaces the phantom with the real token only on the permitted GitHub request."
    style: blue
  - text: >-
      nono run -s --allow-cwd --profile "$ONEPASSWORD_PROFILE" -- gh api rate_limit | jq '{core: .resources.core}'

  - pause
  - comment: "No credential route: the same GitHub API request runs anonymously under the basic profile, reducing the core rate limit from 5000 to 60."
    style: blue
  - text: >-
      nono run -s --allow-cwd --profile "$BASIC_PROFILE" -- gh api rate_limit | jq '{core: .resources.core}'

  - pause
  - comment: "Allowed high-level read: gh issue view passes both the argv policy and the L7 endpoint policy."
    style: blue
  - text: >-
      nono run -s --allow-cwd --profile "$ONEPASSWORD_PROFILE" -- gh issue view 1052 --repo nolabs-ai/nono --json title,url,state | jq

  - pause
  - comment: "Allowed low-level read: gh api can reach the configured GET issue path."
    style: blue
  - text: >-
      nono run -s --allow-cwd --profile "$ONEPASSWORD_PROFILE" -- gh api repos/nolabs-ai/nono/issues/1052 --jq .title

  - pause
  - comment: "Deny policy: these issue mutations are blocked by argv before gh can contact GitHub."
    style: blue
  - text: >-
      jq '.command_policies.commands.gh.from.session.invocation_policy.deny | map(select(.argv.prefix[0]=="issue")) | map(.argv.prefix | join(" "))' "$ONEPASSWORD_PROFILE"

  - pause
  - comment: "Argument denial: issue comments are blocked before gh can contact GitHub."
    style: blue
  - text: >-
      nono run -s --no-diagnostics --allow-cwd --profile "$ONEPASSWORD_PROFILE" -- gh issue comment 1052 --repo nolabs-ai/nono --body 'nono arg deny test'

  - pause
  - comment: "L7 denial: even an allowed gh api invocation cannot POST to the issue comments endpoint."
    style: blue
  - text: >-
      nono run -s --no-diagnostics --allow-cwd --profile "$ONEPASSWORD_PROFILE" -- gh api -X POST repos/nolabs-ai/nono/issues/1052/comments -f body='nono L7 deny test'

  - pause
  - comment: "Child mediation: wrapping gh in a shell does not bypass the command policy."
    style: blue
  - text: >-
      nono run -s --no-diagnostics --allow-cwd --profile "$ONEPASSWORD_PROFILE" -- sh -c 'gh issue comment 1052 --repo nolabs-ai/nono --body "wrapped bypass attempt"'

  - pause
  - comment: "Agent read: Claude Code uses gh with the same 1Password-backed credential route and read-only tool policy."
    style: blue
  - text: >-
      nono run -s --allow-cwd --profile "$ONEPASSWORD_PROFILE" -- claude 'Use gh to fetch the title and state of issue 1052 in the nolabs-ai/nono repo, then report just those.' --dangerously-skip-permissions --allowedTools Bash

  - pause
  - comment: "Agent write: Claude Code attempts to comment, but nono blocks the child gh mutation at the tool boundary."
    style: blue
  - text: >-
      nono run -s --allow-cwd --profile "$ONEPASSWORD_PROFILE" -- claude 'Use gh to post a comment saying hello on issue 1052 in the nolabs-ai/nono repo.' --dangerously-skip-permissions --allowedTools Bash
