name: Release PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Only run on chore: release v* PRs.
jobs:
  cross-compile:
    name: Cross-compile ${{ matrix.target }}
    if: "startsWith(github.event.pull_request.title, 'chore: release v')"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-14
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }} -p nono-cli

      - name: Build (cross aarch64-unknown-linux-gnu)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target aarch64-unknown-linux-gnu -p nono-cli

      - name: Verify binary does not link libdbus (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/nono"
          needed="$(objdump -p "$bin" | awk '/NEEDED/ {print $2}')"
          echo "NEEDED libraries for $bin:"
          echo "$needed"
          if echo "$needed" | grep -qi '^libdbus'; then
            echo "::error::$bin links libdbus — the release binary is not portable"
            exit 1
          fi
          echo "OK: no libdbus dependency"

  copr-build:
    name: COPR Build (Fedora 42)
    if: "startsWith(github.event.pull_request.title, 'chore: release v')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-copr-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-copr-

      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build SRPM
        run: scripts/build-srpm.sh

      - name: Rebuild SRPM in Fedora 42 mock chroot
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            -v "$(pwd)/target/rpm/copr/SRPMS:/srpms:ro" \
            -v "$(pwd)/target/rpm/mock-result:/result" \
            "fedora:42" \
            bash -c "
              set -euo pipefail
              dnf install -y mock shadow-utils
              groupadd -f mock
              useradd -m builder -G mock
              mkdir -p /result && chown builder /result
              su builder -c 'mock -r fedora-42-x86_64 --isolation=simple --resultdir=/result --rebuild /srpms/*.src.rpm'
            "

      - name: Upload mock result on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mock-result-fc42
          path: target/rpm/mock-result/
          retention-days: 7
