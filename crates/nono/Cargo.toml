[package]
name = "nono"
version = "0.81.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Capability-based sandboxing library using Landlock (Linux) and Seatbelt (macOS)"
readme = "README.md"
keywords = ["sandbox", "security", "capability", "landlock", "seatbelt"]
categories = ["os", "api-bindings"]

[features]
default = ["system-keyring"]
# Enables OS system keyring access (macOS Keychain / Linux Secret Service).
# Headless/container consumers opt out with default-features = false.
system-keyring = ["dep:keyring"]

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
zeroize.workspace = true
sha2.workspace = true
getrandom.workspace = true
walkdir.workspace = true
ignore.workspace = true
globset.workspace = true
regress = "0.12"
idna.workspace = true

# Unix socket IPC for supervisor
libc = "0.2"

# Keychain access (optional). Keyring's v1 compatibility feature selects the
# native Keychain backend on macOS and the pure-Rust zbus Secret Service
# backend on Linux, with no libdbus runtime dependency.
keyring = { version = "4", features = ["v1"], optional = true, default-features = false }

# Sigstore bundle verification. The release line is coordinated with
# sigstore-sign at the workspace level.
sigstore-verify.workspace = true
x509-cert = { version = "0.3", default-features = false }
der = { version = "0.8", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true
nix = { workspace = true, features = ["fs", "user"] }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { workspace = true, features = ["fs", "user"] }

[build-dependencies]
typify = "0.8"
serde_json.workspace = true
syn = "3"
prettyplease = "0.3"
gix = { version = "0.90.0", default-features = false, features = ["sha1", "status"] }

[dev-dependencies]
tempfile.workspace = true
jsonschema = "0.60"

[lints]
workspace = true
