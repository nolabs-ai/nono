[package]
name = "nono-cli"
version = "0.81.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CLI for nono capability-based sandbox"
readme = "README.md"
keywords = ["sandbox", "security", "cli", "landlock", "seatbelt"]
categories = ["command-line-utilities", "development-tools"]

[package.metadata.deb]
maintainer = "Luke Hinds"
copyright = "2026, Luke Hinds"
depends = "$auto, libc6 (>= 2.34)"
recommends = "1password-cli | gnome-keyring"
section = "utils"
priority = "optional"
assets = [
    ["target/release/nono", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/nono/README", "644"],
    ["../../LICENSE", "usr/share/doc/nono/LICENSE", "644"],
]

[[bin]]
name = "nono"
path = "src/main.rs"

[features]
default = ["system-keyring"]
# Enables OS system keyring access (macOS Keychain / Linux Secret Service).
# The Linux backend is pure-Rust (zbus), so the default build needs no libdbus;
# disable this only for fully-static/distroless builds with no Secret Service.
# Controls keyring for nono-cli, nono, and nono-proxy in one flag.
system-keyring = ["dep:keyring", "nono/system-keyring", "nono-proxy/system-keyring"]
# Enables test-only trust root overrides used by the integration harness.
test-trust-overrides = []

[dependencies]
nono = { version = "0.81.0", path = "../nono", default-features = false }
nono-proxy = { version = "0.81.0", path = "../nono-proxy", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
colored = "3"
similar = "3"
rand = "0.10"
which = "8"
toml.workspace = true
xdg-home = "1.3.0"
dirs = "7"
walkdir.workspace = true
ignore.workspace = true
chrono = { version = "0.4", features = ["serde"] }
uuid.workspace = true
base64.workspace = true

# Allocation-free integer formatting for the post-fork cgroup self-attach path
# (resource_cgroup::child_self_attach), where malloc could deadlock.
itoa = "1"

# Signing key PKCS#8 serialization (already transitive via sigstore-verify)
aws-lc-rs = "1.17.3"

# Keystore access for trust signing keys (optional). Keyring's v1 compatibility
# feature selects the native Keychain backend on macOS and the pure-Rust zbus
# Secret Service backend on Linux, with no libdbus runtime dependency.
keyring = { version = "4", features = ["v1"], optional = true, default-features = false }

# Keyless (Sigstore/Fulcio/Rekor) signing for instruction file attestation
sigstore-sign.workspace = true
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "signal"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util = "0.3"

ureq = { version = "3", features = ["platform-verifier", "socks-proxy"] }
semver = "1"

zeroize.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "0.10.0"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url.workspace = true
globset.workspace = true
regex = "1"
urlencoding = "2"
tempfile.workspace = true
vt100 = "0.18.1"
shlex = "2"
jsonc-parser = { version = "0.34", features = ["serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["process", "signal", "fs", "user", "term", "dir"] }
landlock.workspace = true
# `--log-journald` sink; other targets have no journald socket.
tracing-journald.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
nix = { workspace = true, features = ["process", "signal", "fs", "user", "term", "dir"] }
security-framework = "3"
security-framework-sys = "2"
core-foundation = "0.10"
core-foundation-sys = "0.8"
x509-parser = "0.18"

[build-dependencies]
toml.workspace = true
serde.workspace = true

[dev-dependencies]
# Path-only on purpose: `cargo package` strips a versionless path
# dev-dependency, so publishing nono-cli does not require this crate on
# crates.io.
nono-test-support = { path = "../nono-test-support" }
jsonschema = "0.60"
proptest = "1"

[lints]
workspace = true
