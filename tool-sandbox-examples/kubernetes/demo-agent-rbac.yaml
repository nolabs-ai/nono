apiVersion: v1
kind: Namespace
metadata:
  name: nono-demo-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nono-demo-agent
  namespace: nono-demo-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nono-demo-agent-read
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nono-demo-agent-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nono-demo-agent-read
subjects:
  - kind: ServiceAccount
    name: nono-demo-agent
    namespace: nono-demo-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nono-demo-agent-operate-workloads
  namespace: nono-demo-system
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nono-demo-agent-operate-workloads
  namespace: nono-demo-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nono-demo-agent-operate-workloads
subjects:
  - kind: ServiceAccount
    name: nono-demo-agent
    namespace: nono-demo-system
