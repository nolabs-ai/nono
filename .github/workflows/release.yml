name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v0.2.3)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    if: github.repository == 'nolabs-ai/nono'
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (glibc) - use 22.04 for broader GLIBC compatibility
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: nono

          # macOS x86_64 (Intel)
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: nono

          # macOS aarch64 (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-14
            artifact: nono

          # Linux aarch64 (ARM64)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: nono

          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            artifact: nono

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      # rpm is needed for building .rpm release artifacts; libdbus is no longer
      # required now that the Linux keyring backend is pure-Rust (zbus).
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config rpm musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross

      - name: Build
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }} -p nono-cli
        env:
          NONO_INSTALL_SOURCE: github_release

      - name: Build (cross aarch64-unknown-linux-gnu)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target aarch64-unknown-linux-gnu -p nono-cli
        env:
          NONO_INSTALL_SOURCE: github_release

      # The portable .tar.gz artifacts carry no dependency metadata, so a binary
      # that links libdbus would fail to start on hosts without it. The Linux
      # keyring backend is the pure-Rust zbus path; guard against a regression
      # back to the C Secret Service backend. objdump parses the ELF NEEDED
      # entries for both native and cross-built (aarch64) binaries.
      - name: Verify binary does not link libdbus (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/nono"
          needed="$(objdump -p "$bin" | awk '/NEEDED/ {print $2}')"
          echo "NEEDED libraries for $bin:"
          echo "$needed"
          if echo "$needed" | grep -qi '^libdbus'; then
            echo "::error::$bin links libdbus — the release binary is not portable"
            exit 1
          fi
          echo "OK: no libdbus dependency"

      # Signing + notarization must happen before Package so the .tar.gz,
      # SHA256SUMS, and build-provenance attestations all cover the signed
      # binary. The Developer ID certificate lives in a throwaway keychain
      # that is deleted in the always() cleanup step below.
      - name: Import signing certificate (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"

          # Allow codesign to use the key without a UI password prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Sign binary (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/nono"
          codesign --force --timestamp --options runtime \
            --identifier ai.nolabs.nono \
            --sign "$APPLE_SIGNING_IDENTITY" \
            "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          codesign --display --verbose=2 "$BIN"

      # notarytool only accepts zip/dmg/pkg, so the binary is submitted in a
      # temporary zip. Stapling is skipped: tickets cannot be stapled to bare
      # Mach-O executables, so Gatekeeper looks the ticket up online instead.
      - name: Notarize binary (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/nono"
          ditto -c -k "$BIN" "$RUNNER_TEMP/nono-notarize.zip"

          SUBMISSION_JSON="$(xcrun notarytool submit "$RUNNER_TEMP/nono-notarize.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --output-format json)"
          echo "$SUBMISSION_JSON"

          STATUS="$(echo "$SUBMISSION_JSON" | jq -r '.status')"
          SUBMISSION_ID="$(echo "$SUBMISSION_JSON" | jq -r '.id')"
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization failed with status: $STATUS"
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID"
            exit 1
          fi

      - name: Clean up signing keychain (macOS)
        if: always() && runner.os == 'macOS'
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../nono-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz ${{ matrix.artifact }}
          cd ../../..

      - name: Install cargo-deb
        if: runner.os == 'Linux' && (matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu')
        run: cargo install cargo-deb

      - name: Build .deb (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          VERSION="${{ env.RELEASE_TAG }}"
          VERSION="${VERSION#v}"
          cd crates/nono-cli
          cargo deb --deb-version "$VERSION"

      - name: Build .deb (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          VERSION="${{ env.RELEASE_TAG }}"
          VERSION="${VERSION#v}"
          cd crates/nono-cli
          cargo deb --target aarch64-unknown-linux-gnu --no-build --deb-version "$VERSION"

      - name: Build .rpm
        if: runner.os == 'Linux' && matrix.target != 'x86_64-unknown-linux-musl'
        run: |
          VERSION="${{ env.RELEASE_TAG }}"
          VERSION="${VERSION#v}"
          scripts/build-rpm.sh "$VERSION" "${{ matrix.target }}"

      - name: Prepare upload
        shell: bash
        run: |
          mkdir -p artifact_staging
          cp "nono-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz" artifact_staging/
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ] && [ -d target/debian ]; then
            cp target/debian/*.deb artifact_staging/
          fi
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ] && [ -d target/aarch64-unknown-linux-gnu/debian ]; then
            cp target/aarch64-unknown-linux-gnu/debian/*.deb artifact_staging/
          fi
          if [ -d "target/rpm/${{ matrix.target }}/RPMS" ]; then
            find "target/rpm/${{ matrix.target }}/RPMS" -name "*.rpm" -exec cp {} artifact_staging/ \;
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nono-${{ matrix.target }}
          path: artifact_staging

  attest:
    name: Attest Release Artifacts
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/**/*.tar.gz
            artifacts/**/*.deb
            artifacts/**/*.rpm

  release:
    name: Create Release
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -name "*.tar.gz" -exec mv {} . \;
          find . -name "*.deb" -exec mv {} . \;
          find . -name "*.rpm" -exec mv {} . \;
          sha256sum -- *.tar.gz *.deb *.rpm > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/SHA256SUMS.txt

  publish-oci:
    name: Publish OCI artifacts to GHCR
    needs: release
    runs-on: ubuntu-latest
    if: >-
      ${{ github.repository == 'nolabs-ai/nono' &&
      !contains(github.event.inputs.tag || github.ref_name, 'alpha') &&
      !contains(github.event.inputs.tag || github.ref_name, 'beta') &&
      !contains(github.event.inputs.tag || github.ref_name, 'rc') }}
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      OCI_REPO: ghcr.io/nolabs-ai/nono
      ARTIFACT_TYPE: application/vnd.nono.binary.v1
      LAYER_MEDIA_TYPE: application/vnd.nono.binary.layer.v1.tar+gzip
    steps:
      - name: Validate tag
        run: |
          set -euo pipefail
          if ! echo "$RELEASE_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::RELEASE_TAG '${RELEASE_TAG}' is not a stable semver tag"
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: nono-*
          merge-multiple: true

      - name: Verify checksums against published SHA256SUMS.txt
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const path = require('path');

            const tag = process.env.RELEASE_TAG;
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');

            const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            const asset = release.assets.find(a => a.name === 'SHA256SUMS.txt');
            if (!asset) {
              core.setFailed(`SHA256SUMS.txt not found in release ${tag}`);
              return;
            }

            const response = await github.request(
              'GET /repos/{owner}/{repo}/releases/assets/{asset_id}',
              { owner, repo, asset_id: asset.id, headers: { accept: 'application/octet-stream' } }
            );
            const sums = Object.fromEntries(
              Buffer.from(response.data).toString('utf8').trim().split('\n')
                .map(l => l.trim().split(/\s+/))
                .filter(p => p.length === 2)
                .map(([hash, name]) => [name, hash])
            );

            const targets = [
              'x86_64-unknown-linux-gnu',
              'aarch64-unknown-linux-gnu',
              'x86_64-apple-darwin',
              'aarch64-apple-darwin',
            ];

            let failed = false;
            for (const target of targets) {
              const filename = `nono-${tag}-${target}.tar.gz`;
              const filepath = path.join('artifacts', filename);
              if (!fs.existsSync(filepath)) {
                core.error(`Expected artifact not found: ${filepath}`);
                failed = true;
                continue;
              }
              const expected = sums[filename];
              if (!expected) {
                core.error(`No entry for ${filename} in SHA256SUMS.txt`);
                failed = true;
                continue;
              }
              const actual = crypto.createHash('sha256').update(fs.readFileSync(filepath)).digest('hex');
              if (actual !== expected) {
                core.error(`Checksum mismatch for ${filename}: expected ${expected}, got ${actual}`);
                failed = true;
                continue;
              }
              core.info(`✓ ${filename}`);
            }

            if (failed) core.setFailed('One or more checksum verifications failed');

      - name: Install ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for existing OCI index
        id: existing
        run: |
          set -euo pipefail
          if resolve_output=$(oras resolve "$OCI_REPO:${VERSION}-binary" 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::OCI index ${VERSION}-binary already exists; skipping push"
          else
            exit_code=$?
            if echo "$resolve_output" | grep -qiE 'not found|does not exist|404'; then
              echo "exists=false" >> "$GITHUB_OUTPUT"
            else
              echo "::error::oras resolve failed (exit ${exit_code}): ${resolve_output}"
              exit "$exit_code"
            fi
          fi

      - name: Push per-platform artifacts
        if: steps.existing.outputs.exists == 'false'
        run: |
          set -euo pipefail
          CHILD_DIGESTS=""
          cd artifacts
          for target in \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            x86_64-apple-darwin \
            aarch64-apple-darwin; do
            case "$target" in
              x86_64-unknown-linux-gnu)  os=linux;  arch=amd64 ;;
              aarch64-unknown-linux-gnu) os=linux;  arch=arm64 ;;
              x86_64-apple-darwin)       os=darwin; arch=amd64 ;;
              aarch64-apple-darwin)      os=darwin; arch=arm64 ;;
            esac
            tag="${VERSION}-binary-${os}-${arch}"
            file="nono-${RELEASE_TAG}-${target}.tar.gz"
            # Write the platform config blob; oras manifest index create reads this
            # to populate the platform descriptor in the index.
            printf '{"os":"%s","architecture":"%s"}' "$os" "$arch" \
              > "${RUNNER_TEMP}/config-${os}-${arch}.json"
            digest=$(oras push "$OCI_REPO:${tag}" \
              --artifact-type "$ARTIFACT_TYPE" \
              --config "${RUNNER_TEMP}/config-${os}-${arch}.json:application/vnd.oci.image.config.v1+json" \
              --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --annotation "org.opencontainers.image.version=${VERSION}" \
              --annotation "org.opencontainers.image.ref.name=${tag}" \
              --annotation "org.opencontainers.image.description=nono CLI ${target}" \
              --annotation "ai.nolabs.nono.target=${target}" \
              --format go-template='{{.digest}}' \
              "${file}:${LAYER_MEDIA_TYPE}")
            if ! echo "$digest" | grep -qE '^sha256:[0-9a-f]{64}$'; then
              echo "::error::Unexpected digest format for ${target}: ${digest}"
              exit 1
            fi
            echo "Pushed ${target} → ${digest}"
            CHILD_DIGESTS="${CHILD_DIGESTS} $OCI_REPO@${digest}"
          done
          echo "CHILD_DIGESTS=${CHILD_DIGESTS}" >> "$GITHUB_ENV"

      - name: Create OCI index
        if: steps.existing.outputs.exists == 'false'
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          oras manifest index create "$OCI_REPO:${VERSION}-binary" \
            --artifact-type "$ARTIFACT_TYPE" \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.version=${VERSION}" \
            $CHILD_DIGESTS

      - name: Verify OCI index structure
        run: |
          set -euo pipefail
          INDEX_DIGEST=$(oras resolve "$OCI_REPO:${VERSION}-binary")
          if ! echo "$INDEX_DIGEST" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "::error::Unexpected index digest format: ${INDEX_DIGEST}"
            exit 1
          fi
          echo "INDEX_DIGEST=${INDEX_DIGEST}" >> "$GITHUB_ENV"
          manifest=$(oras manifest fetch "$OCI_REPO@${INDEX_DIGEST}")
          echo "$manifest" | jq -e \
            --arg at "$ARTIFACT_TYPE" \
            '
              .mediaType == "application/vnd.oci.image.index.v1+json" and
              .artifactType == $at and
              (.manifests | length) == 4 and
              ([ .manifests[].platform | "\(.os)/\(.architecture)" ] | sort) ==
                ["darwin/amd64","darwin/arm64","linux/amd64","linux/arm64"]
            ' > /dev/null || {
            echo "::error::OCI index structure check failed"
            echo "$manifest" | jq .
            exit 1
          }
          CHILD_DIGESTS=""
          for target in \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            x86_64-apple-darwin \
            aarch64-apple-darwin; do
            file="artifacts/nono-${RELEASE_TAG}-${target}.tar.gz"
            expected_digest="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            case "$target" in
              x86_64-unknown-linux-gnu)  plat="linux/amd64" ;;
              aarch64-unknown-linux-gnu) plat="linux/arm64" ;;
              x86_64-apple-darwin)       plat="darwin/amd64" ;;
              aarch64-apple-darwin)      plat="darwin/arm64" ;;
            esac
            child_digest=$(echo "$manifest" | jq -r \
              --arg p "$plat" \
              '.manifests[] | select(.platform.os + "/" + .platform.architecture == $p) | .digest')
            if ! echo "$child_digest" | grep -qE '^sha256:[0-9a-f]{64}$'; then
              echo "::error::Unexpected child digest format for ${target}: ${child_digest}"
              exit 1
            fi
            child_manifest=$(oras manifest fetch "$OCI_REPO@${child_digest}")
            echo "$child_manifest" | jq -e \
              --arg at "$ARTIFACT_TYPE" \
              --arg ed "$expected_digest" \
              '.artifactType == $at and (.layers | length) == 1 and .layers[0].digest == $ed' \
              > /dev/null || {
              echo "::error::Child manifest check failed for ${target}"
              echo "$child_manifest" | jq .
              exit 1
            }
            CHILD_DIGESTS="${CHILD_DIGESTS} $OCI_REPO@${child_digest}"
          done
          echo "CHILD_DIGESTS=${CHILD_DIGESTS}" >> "$GITHUB_ENV"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign OCI artifacts with Cosign
        run: |
          set -euo pipefail
          cosign sign --yes "$OCI_REPO@${INDEX_DIGEST}"
          # shellcheck disable=SC2086
          for child in $CHILD_DIGESTS; do
            cosign sign --yes "$child"
          done

      - name: Tag latest-binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LATEST_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          if ! echo "$LATEST_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Latest release tag '${LATEST_TAG}' is not a stable semver tag"
            exit 1
          fi
          if [ "$LATEST_TAG" != "$RELEASE_TAG" ]; then
            echo "::notice::latest-binary not advanced: ${RELEASE_TAG} is not the latest release (${LATEST_TAG} is)"
            exit 0
          fi
          oras tag "$OCI_REPO@${INDEX_DIGEST}" latest-binary
          actual=$(oras resolve "$OCI_REPO:latest-binary")
          if [ "$actual" != "$INDEX_DIGEST" ]; then
            echo "::error::latest-binary points to ${actual}, expected ${INDEX_DIGEST}"
            exit 1
          fi
          echo "LATEST_BINARY=true" >> "$GITHUB_ENV"
          echo "Tagged ${OCI_REPO}:latest-binary → ${INDEX_DIGEST}"

      - name: Write step summary
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const repo   = process.env.OCI_REPO;
            const ver    = process.env.VERSION    || '<unset>';
            const digest = process.env.INDEX_DIGEST || 'unknown';
            const tag    = process.env.RELEASE_TAG;
            const ghRepo = process.env.GITHUB_REPOSITORY;

            await core.summary
              .addHeading('OCI Artifacts published')
              .addRaw(`**Index:** \`${repo}:${ver}-binary\`\n`)
              .addRaw(`**Digest:** \`${digest}\`\n`)
              .addHeading('Pull examples', 3)
              .addCodeBlock(
                `oras pull --platform linux/amd64 ${repo}:${ver}-binary -o .\n` +
                `oras pull --platform darwin/arm64 ${repo}:${ver}-binary -o .`,
                'bash'
              )
              .addHeading('Verify signature', 3)
              .addCodeBlock(
                `cosign verify \\\n` +
                `  --certificate-identity "https://github.com/${ghRepo}/.github/workflows/release.yml@refs/tags/${tag}" \\\n` +
                `  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\\n` +
                `  "${repo}@${digest}"`,
                'bash'
              )
              .write();

  update-nix-hashes:
    name: Update Nix prebuilt hashes
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31

      - name: Prefetch hashes and update flake.nix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          import json, os, re, subprocess, urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          version = tag.lstrip("v")
          print(f"Updating prebuilt hashes for {tag} (version {version})")

          # Fetch the release to get asset names + SHA256SUMS.txt for cross-check
          token = os.environ["GH_TOKEN"]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/releases/tags/{tag}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
          with urllib.request.urlopen(req) as r:
              release = json.load(r)

          # Map Nix system -> release tarball target substring
          asset_map = {
              "x86_64-linux":    "x86_64-unknown-linux-gnu",
              "aarch64-linux":   "aarch64-unknown-linux-gnu",
              "x86_64-darwin":   "x86_64-apple-darwin",
              "aarch64-darwin":  "aarch64-apple-darwin",
          }

          asset_names = {a["name"] for a in release["assets"]}

          # Parse SHA256SUMS.txt for cross-check (catches corrupted/replaced artifacts)
          sha256sums_url = next(
              (a["browser_download_url"] for a in release["assets"]
               if a["name"] == "SHA256SUMS.txt"), None)
          if not sha256sums_url:
              raise SystemExit(f"SHA256SUMS.txt is missing from release {tag}")
          expected_hashes = {}
          with urllib.request.urlopen(sha256sums_url) as r:
              for line in r.read().decode().splitlines():
                  parts = line.split(None, 1)
                  if len(parts) == 2:
                      expected_hashes[parts[1].strip()] = "sha256:" + parts[0]

          src = open("flake.nix").read()
          hashes_start = src.find("prebuiltHashes = {")
          if hashes_start == -1:
              raise SystemExit("could not find prebuiltHashes block in flake.nix")
          hashes_end = src.find("};", hashes_start)
          if hashes_end == -1:
              raise SystemExit("could not find end of prebuiltHashes block in flake.nix")
          before_hashes = src[:hashes_start]
          hashes_src = src[hashes_start:hashes_end]
          after_hashes = src[hashes_end:]
          for sys_, sub in asset_map.items():
              # Find the tarball asset for this platform
              match = next(
                  (n for n in asset_names if sub in n and n.endswith(".tar.gz")), None)
              if not match:
                  raise SystemExit(
                      f"no asset matching '{sub}' in release {tag}; "
                      f"have: {sorted(asset_names)}")
              url = f"https://github.com/{repo}/releases/download/{tag}/{match}"

              # Cross-check against SHA256SUMS.txt before pinning
              expected = expected_hashes.get(match)
              if not expected:
                  raise SystemExit(
                      f"SHA256SUMS.txt has no checksum for '{match}' in release {tag}")
              cmd = [
                  "nix", "store", "prefetch-file", "--json", "--hash-type", "sha256",
              ]
              cmd += ["--expected-hash", expected]
              cmd += [url]
              out = json.loads(subprocess.check_output(cmd))
              sri = out["hash"]
              print(f"  {sys_}: {match} -> {sri}")

              # Update the prebuiltHashes entry for this system
              pat = re.compile(r'("' + re.escape(sys_) + r'" = ")([^"]*)(")')
              hashes_src, n = pat.subn(
                  lambda m, s=sri: m.group(1) + s + m.group(3), hashes_src, count=1)
              if n != 1:
                  raise SystemExit(
                      f"could not find prebuiltHashes entry for {sys_} in flake.nix")

          src = before_hashes + hashes_src + after_hashes
          open("flake.nix", "w").write(src)
          print(f"Updated prebuiltHashes for {version}: {list(asset_map)}")
          PYEOF

      - name: Verify prebuilt package
        run: |
          nix build .#prebuilt --print-build-logs
          nix run .#prebuilt -- --version

      - name: Open PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore(nix): update prebuilt hashes for ${{ env.RELEASE_TAG }}"
          title: "chore(nix): update prebuilt hashes for ${{ env.RELEASE_TAG }}"
          branch: chore/nix-hashes-${{ env.RELEASE_TAG }}
          body: |
            Auto-generated by the release workflow after publishing ${{ env.RELEASE_TAG }}.

            Prefetches the per-platform SHA-256 hashes for the new release tarballs
            and updates `prebuiltHashes` in `flake.nix`. The hashes are cross-checked
            against `SHA256SUMS.txt` before pinning.

            Note: PRs opened by `GITHUB_TOKEN` do not trigger downstream CI runs.
            Review the diff before merging — it should be a hash refresh only.
          labels: nix

  publish-crates:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    # Only publish stable releases to crates.io
    if: ${{ !contains(github.event.inputs.tag || github.ref_name, 'alpha') && !contains(github.event.inputs.tag || github.ref_name, 'beta') && !contains(github.event.inputs.tag || github.ref_name, 'rc') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Publish nono (core library)
        run: |
          VERSION="${RELEASE_TAG#v}"
          if cargo search nono --limit 1 2>/dev/null | grep -q "\"$VERSION\""; then
            echo "nono $VERSION already published, skipping"
          else
            cargo publish -p nono --allow-dirty --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish nono-proxy
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "Waiting for nono $VERSION to appear on crates.io..."
          for i in $(seq 1 30); do
            if cargo search nono --limit 1 2>/dev/null | grep -q "\"$VERSION\""; then
              echo "Found nono $VERSION on crates.io"
              break
            fi
            echo "Attempt $i: not yet indexed, retrying in 10s..."
            sleep 10
          done
          if cargo search nono-proxy --limit 1 2>/dev/null | grep -q "\"$VERSION\""; then
            echo "nono-proxy $VERSION already published, skipping"
          else
            cargo publish -p nono-proxy --allow-dirty --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish nono-cli
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "Waiting for nono-proxy $VERSION to appear on crates.io..."
          for i in $(seq 1 30); do
            if cargo search nono-proxy --limit 1 2>/dev/null | grep -q "\"$VERSION\""; then
              echo "Found nono-proxy $VERSION on crates.io"
              break
            fi
            echo "Attempt $i: not yet indexed, retrying in 10s..."
            sleep 10
          done
          if cargo search nono-cli --limit 1 2>/dev/null | grep -q "\"$VERSION\""; then
            echo "nono-cli $VERSION already published, skipping"
          else
            cargo publish -p nono-cli --allow-dirty --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  notify-downstream:
    name: Notify Downstream Repos
    needs: [release, publish-crates]
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.inputs.tag || github.ref_name, 'alpha') && !contains(github.event.inputs.tag || github.ref_name, 'beta') && !contains(github.event.inputs.tag || github.ref_name, 'rc') }}
    strategy:
      fail-fast: false
      matrix:
        repo:
          - nolabs-ai/nono-py
          - nolabs-ai/nono-docs
    steps:
      - name: Dispatch to ${{ matrix.repo }}
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.DOWNSTREAM_PAT }}
          repository: ${{ matrix.repo }}
          event-type: nono-release
          client-payload: '{"nono_version": "${{ env.RELEASE_TAG }}"}'
