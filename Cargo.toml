[workspace]
resolver = "3"
members = [
    "crates/nono",
    "crates/nono-cli",
    "crates/nono-proxy",
    "crates/nono-test-support",
    "bindings/c",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
authors = ["Luke Hinds"]
license = "Apache-2.0"
repository = "https://github.com/nolabs-ai/nono"
homepage = "https://github.com/nolabs-ai/nono"

[workspace.dependencies]
# Error handling
thiserror = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.0"

# Logging
tracing = "0.1"
# Linux-only sink for proxy audit events, used by nono-cli's target dependencies.
tracing-journald = "0.3"

# Secure credential handling
zeroize = { version = "1", features = ["alloc", "serde"] }

# Sigstore signing and verification. Keep these on the same release line;
# Dependabot groups sigstore-* updates so API and dependency-graph migrations
# arrive together.
sigstore-sign = "0.15.0"
sigstore-verify = { version = "0.15.0", default-features = false }

# Hashing
sha2 = "0.11"
sha1 = "0.11"
uuid = { version = "1", features = ["serde", "v7"] }

# Filesystem walking
walkdir = "2"
ignore = "0.4"
globset = "0.4"

# Shared system dependencies
nix = "0.31.3"
landlock = "0.4.7"
url = "2"
idna = "1"
getrandom = "0.4"
base64 = "0.23"

# Async runtime and HTTP
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "signal", "sync", "time"] }
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "client-legacy", "http1", "http2"] }
http-body-util = "0.1"

# Testing
tempfile = "3"

# C FFI bindings
cbindgen = "0.29"

[workspace.lints.clippy]
unwrap_used = "deny"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
